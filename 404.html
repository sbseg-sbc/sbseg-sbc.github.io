<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada: SBSeg</title>
<meta name="description" content="Página não encontrada no arquivo do SBSeg. Endereços antigos das edições são redirecionados automaticamente.">
<meta name="robots" content="noindex">
<script>
  /* Endereços antigos /sbsegAAAA/... agora vivem em repositórios próprios, servidos em /AAAA/...
     Ex.: /sbseg2024/sbseg2024.ita.br/programacao/ vai para /2024/sbseg2024.ita.br/programacao/ */
  (() => {
    const m = location.pathname.match(/^\/sbseg((?:19|20)\d\d)(\/.*)?$/);
    if (m) {
      location.replace(`/${m[1]}${m[2] || "/"}${location.search}${location.hash}`);
    }
  })();
</script>
<style>
  :root { --texto: #16242a; --apagado: #5d6b72; --destaque: #0a6457; }
  body { margin: 0; padding: 4rem 1.25rem; font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--texto); background: #fff; line-height: 1.6; }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 2rem; line-height: 1.2; }
  p { color: var(--apagado); }
  a { color: var(--destaque); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Página não encontrada</h1>
  <p>O endereço pode ter mudado. Desde novembro de 2026, cada edição do SBSeg tem endereço próprio, como <a href="/2026/">sbseg-sbc.github.io/2026/</a> e <a href="/2027/">sbseg-sbc.github.io/2027/</a>.</p>
  <p><a href="/">Ir para o arquivo de todas as edições</a></p>
</main>
</body>
</html>
